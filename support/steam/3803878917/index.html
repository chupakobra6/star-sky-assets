*{box-sizing:border-box}
html{min-height:100%;background:#111116;color:#f3f0fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-width:240px;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 43%,#252031 0%,#18161f 35%,#111116 72%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.65;background:radial-gradient(1px 1px at 15% 26%,#c4bddb 70%,transparent),radial-gradient(1px 1px at 78% 18%,#a5a1b5 70%,transparent),radial-gradient(1px 1px at 87% 68%,#beb0d6 70%,transparent),radial-gradient(1px 1px at 24% 76%,#8a849a 70%,transparent),radial-gradient(1px 1px at 59% 83%,#b8afcf 70%,transparent),radial-gradient(1px 1px at 43% 13%,#8b819f 70%,transparent)}

.horizon{position:absolute;left:50%;top:calc(50% - 35px);width:min(760px,calc(100vw - 24px));height:auto;transform:translateX(-50%);pointer-events:none}
.horizon path{stroke-dasharray:1;stroke-dashoffset:0;opacity:.65;animation:draw-arc 300ms 120ms cubic-bezier(.2,.65,.3,1) both}
.symbol{position:relative;width:clamp(168px,30vw,228px);margin-bottom:-12px}
.symbol::before{content:"";position:absolute;inset:18%;border-radius:50%;background:#b29adc;filter:blur(48px);opacity:.09;animation:glow 450ms ease-out both}
.mark{position:relative;display:block;width:100%;height:auto;mix-blend-mode:screen;animation:arrive 400ms cubic-bezier(.2,.7,.3,1) both}

p{margin:12px 0 27px;font-size:15px;line-height:1.55;color:#b9b3c6}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border:1px solid #625274;border-radius:24px;color:#e6dbf7;text-decoration:none;font-size:14px;line-height:1.4;transition:background-color 120ms ease,border-color 120ms ease}
a:hover{background:#2d2638;border-color:#bda4d7}
a:focus-visible{outline:2px solid #e4cffc;outline-offset:5px;background:#2d2638}
@keyframes arrive{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{from{opacity:0;transform:scale(.8)}to{opacity:.09;transform:scale(1)}}
@keyframes draw-arc{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:.65}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(max-height:420px){main{padding:12px 20px}.symbol{width:126px;margin-bottom:-8px}p{margin:8px 0 16px}}
